# Render blueprint for the SubTrack API. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: subtrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
